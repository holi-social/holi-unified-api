- id: holi-production
  version: v0.38.25-beta.1
  upstream:
    url: http://host.docker.internal:4000 # always true, as this GraphQL mesh is run within this Docker container
  match:
    url: http://localhost:4455/<.*>
    methods:
      - GET
      - HEAD
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - CONNECT
      - TRACE
      - PATCH
  authenticators:
    - handler: cookie_session
    - handler: bearer_token
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: header
