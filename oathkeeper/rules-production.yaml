# We have three rules
# graphql - redirect all traffic to our GraphQL Mesh server, after checking authorization.
# chatlogin - checks authorization and adds a JWT to the request that is then passed to our unified API server, which adds the JWT to the login body.
# matrix - transfer all requests to the matrix server without any authorization checks, since Matrix uses it's own tokens.
- id: matrix
  version: v0.40.3
  upstream:
    url: https://chat.holi.social:8008
  match:
    url: https://production.unified.apis.holi.social/_matrix/<.*>
    methods:
      - GET
      - HEAD
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - CONNECT
      - TRACE
      - PATCH
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop
- id: chatlogin
  version: v0.40.3
  upstream:
    url: http://localhost:4000 # always true, as this process runs a reverse proxy aside the GraphQL mesh
    strip_path: /api/chatlogin
  match:
    url: https://production.unified.apis.holi.social/api/chatlogin/<.*>
    methods:
      - GET
      - HEAD
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - CONNECT
      - TRACE
      - PATCH
  authenticators:
    - handler: cookie_session
    - handler: bearer_token
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
- id: graphql
  version: v0.40.3
  upstream:
    url: http://localhost:4000 # always true, as this GraphQL mesh is run within this Docker container
  match:
    url: https://production.unified.apis.holi.social/graphql
    methods:
      - GET
      - HEAD
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - CONNECT
      - TRACE
      - PATCH
  authenticators:
    - handler: cookie_session
    - handler: bearer_token
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: header
- id: videocall_login
  version: v0.40.3
  upstream:
    url: http://localhost:4000 # always true, as this process runs alongside the GraphQL mesh
    strip_path: /api
  match:
    url: https://production.unified.apis.<project-holi.org|holi.social>/api/video-call/<.*>
    methods:
      - GET
      - HEAD
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - CONNECT
      - TRACE
      - PATCH
  authenticators:
    - handler: cookie_session
    - handler: bearer_token
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: header
      config:
        headers:
          X-Holi-User-Name: '{{ if and .Extra (index .Extra "identity")}}{{ .Extra.identity.traits.name }}{{ else }}anonymous{{ end }}'
- id: webhook
  version: v0.40.3
  upstream:
    url: http://localhost:4000
  match:
    url: https://production.unified.apis.holi.social/webhook
    methods:
      - POST
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop
