# see https://www.ory.sh/docs/oathkeeper/reference/configuration
# also documents environment variables

serve:
  proxy:
    port: 4455 # run the proxy at port 4455
  api:
    port: 4456 # run the api at port 4456

access_rules:
  repositories: # can be overridden by e.g. setting ACCESS_RULES_REPOSITORIES env variable with JSON content, see https://www.ory.sh/docs/ecosystem/configuring
    - file:///opt/oathkeeper/rules-staging.yaml

errors:
  fallback:
    - json
  handlers:
    json:
      enabled: true
      config:
        verbose: true

mutators:
  header:
    enabled: true
    config:
      headers:
        X-Holi-User-ID: '{{ print .Subject }}'
        X-Holi-User-Email: '{{ if and .Extra (index .Extra "identity")}}{{ print .Extra.identity.traits.email }}{{ else }}anonymous{{ end }}'
        X-Holi-User-given_name: '{{ if and .Extra (index .Extra "identity")}}{{ print .Extra.identity.traits.given_name }}{{ else }}{{ end }}'
        X-Holi-User-family_name: '{{ if and .Extra (index .Extra "identity")}}{{ print .Extra.identity.traits.family_name }}{{ else }}{{ end }}'
        X-Holi-Session: '{{ if .Extra }}{{ print .Extra.id }}{{ end }}'
        X-Holi-Session-Expiry: '{{ if .Extra }}{{ print .Extra.expires_at}}{{ end }}'
  noop:
    enabled: true
  id_token:
    enabled: true
    config:
      issuer_url: https://dev-auth.holi.social # overridden via env var with environment specific value
      jwks_url: file:///opt/oathkeeper/secrets/jwks.json
      ttl: 60s
      claims: '{ {{ if and .Extra (index .Extra "identity") (index .Extra.identity "metadata_public") (index .Extra.identity.metadata_public "identity") }}"ident": "{{ print (lower .Extra.identity.metadata_public.identity) }}"{{ else if and .Extra (index .Extra "identity") (index .Extra.identity.traits "identity") }}"ident": "{{ print (lower .Extra.identity.traits.identity) }}"{{ end }} }'

authorizers:
  allow:
    enabled: true
  deny:
    enabled: true

authenticators:
  noop:
    enabled: true
  anonymous:
    enabled: true
    config:
      subject: anonymous # =default
  cookie_session:
    enabled: true
    config:
      check_session_url: https://dev-auth.holi.social/sessions/whoami # overridden via env var with environment specific value
      preserve_path: true
      extra_from: '@this'
      subject_from: 'identity.id'
      additional_headers:
        accept-encoding: identity
      only:
        - ory_session_mystifyingcarverakajr6v4t8 # overridden via env var with environment specific value
  bearer_token:
    enabled: true
    config:
      check_session_url: https://dev-auth.holi.social/sessions/whoami # overridden via env var with environment specific value
      preserve_path: true
      extra_from: '@this'
      subject_from: 'identity.id'
      additional_headers:
        accept-encoding: identity

log:
  leak_sensitive_values: false
  format: json
  level: error
