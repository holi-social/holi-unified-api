# see https://www.ory.sh/docs/oathkeeper/reference/configuration
# also documents environment variables

serve:
  proxy:
    port: 4455 # run the proxy at port 4455
  api:
    port: 4456 # run the api at port 4456

access_rules:
  repositories: # can be overridden by e.g. setting ACCESS_RULES_REPOSITORIES env variable with JSON content, see https://www.ory.sh/docs/ecosystem/configuring
    - file:///opt/oathkeeper/rules.yaml

errors:
  fallback:
    - json
  handlers:
    json:
      enabled: true
      config:
        verbose: true
    redirect:
      enabled: true
      config:
        to: https://www.ory.sh/docs

mutators:
  header:
    enabled: true
    config:
      headers:
        X-Holi-User-ID: '{{ print .Subject }}'
        X-Holi-User-Email: '{{ if and .Extra (index .Extra "identity")}}{{ .Extra.identity.traits.email }}{{ else }}anonymous{{ end }}'
  noop:
    enabled: true

authorizers:
  allow:
    enabled: true
  deny:
    enabled: true

authenticators:
  anonymous:
    enabled: true
    config:
      subject: anonymous # =default
  cookie_session:
    enabled: true
    config:
      check_session_url: https://dev-auth.project-holi.org/sessions/whoami # overridden via env var with environment specific value
      preserve_path: true
      extra_from: '@this'
      subject_from: 'identity.id'
      additional_headers:
        accept-encoding: identity
      only:
        - ory_session_mystifyingcarverakajr6v4t8 # overridden via env var with environment specific value
  bearer_token:
    enabled: true
    config:
      check_session_url: https://dev-auth.project-holi.org/sessions/whoami # overridden via env var with environment specific value
      preserve_path: true
      extra_from: '@this'
      subject_from: 'identity.id'
      additional_headers:
        accept-encoding: identity

log:
  leak_sensitive_values: false
  format: json
  level: error
