- id: holi-production
  version: v0.39.4
  upstream:
    url: http://localhost:4000 # always true, as this GraphQL mesh is run within this Docker container
  match:
    url: https://<.*>.unified.apis.<project-holi.org|holi.social>/<.*>
    methods:
      - GET
      - HEAD
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - CONNECT
      - TRACE
      - PATCH
  authenticators:
    - handler: cookie_session
    - handler: bearer_token
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: header
