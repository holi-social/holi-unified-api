- id: holi-production
  version: v0.38.25-beta.1
  upstream:
    url: http://localhost:4000
  match:
    url: https://<.*>.unified.apis.project-holi.org/<.*>
    methods:
      - GET
      - HEAD
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - CONNECT
      - TRACE
      - PATCH
  authenticators:
    - handler: cookie_session
    - handler: bearer_token
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
    - handler: header
