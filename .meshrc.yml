  - name: notifications
    handler:
      graphql:
        timeout: 300000
        endpoint: '{env.NOTIFICATIONS_API_URL}'
        operationHeaders:
          Accept-Language: "{context.headers['accept-language']}"
          sentry-trace: "{context.headers['sentry-trace']}"
          X-Holi-User-ID: "{context.headers['x-holi-user-id']}"
    transforms:
      # Prefix for types
      - prefix:
          mode: wrap
          value: Notifications_
          includeRootOperations: false
          includeTypes: true
      # Prefix for operations
      - prefix:
          mode: wrap
          value: notifications_
          includeRootOperations: true
          includeTypes: false
  - name: typesense-search
    handler:
      jsonSchema:
        endpoint: '{env.TYPESENSE_API_URL}'
        operationHeaders:
          x-typesense-api-key: '{env.TYPESENSE_API_KEY}'
        operations:
          - type: Query
            field: documentById
            path: /collections/{env.TYPESENSE_COLLECTION}/documents/search?q=*&filter_by=id:{args.documentType}_{args.id}&&type:{args.documentType}&per_page=1&exclude_fields=embedding,similarity_embedding,topics_skills_embedding_v2
            method: GET
            argTypeMap:
              id:
                type: string
                nullable: false
              documentType:
                type: string
                nullable: false
            responseSchema: ./schemas/typesense/SearchResponse.json
          - type: Query
            field: multiSearch
            path: /multi_search?collection={env.TYPESENSE_COLLECTION}
            method: POST
            requestSchema: ./schemas/typesense/MultiSearchRequest.json
            responseSchema: ./schemas/typesense/MultiSearchResponse.json
    transforms:
      # Prefix for types
      - prefix:
          mode: wrap
          value: Typesense_
          includeRootOperations: false
          includeTypes: true
      # Prefix for operations
      - prefix:
          mode: wrap
          value: typesense_
          includeRootOperations: true
          includeTypes: false
  - name: moderation
    handler:
      graphql:
        timeout: 300000
        endpoint: '{env.MODERATION_BACKEND_URL}'
        operationHeaders:
          Accept-Language: "{context.headers['accept-language']}"
          X-Holi-User-ID: "{context.headers['x-holi-user-id']}"
          X-Holi-Session: "{context.headers['x-holi-session']}"
          X-Holi-Session-Expiry: "{context.headers['x-holi-session-expiry']}"
          X-Holi-User-Email: "{context.headers['x-holi-user-email']}"
    transforms:
      - filterSchema:
          mode: bare | wrap
          filters:
            # mesh only the report mutation
            - Mutation.createReport
            # remove all queries
            - Query.!*
            # remove most of the types that aren't needed for reporting
            # gregor: don't see a way to do this as an include-filter - the other way around
            - Type.!{*Token*, UserRole, User, *Auth*, Create*, Pagination, Report, ReportsFilter, ReportEvent, ReportLogEvent, ReportStatus}
      # Prefix for types
      - prefix:
          mode: wrap
          value: Moderation_
          includeRootOperations: false
          includeTypes: true
      # Prefix for operations
      - prefix:
          mode: wrap
          value: moderation_
          includeRootOperations: true
          includeTypes: false
  - name: rewards
    handler:
      graphql:
        timeout: 300000
        endpoint: '{env.REWARDS_API_URL}'
        operationHeaders:
          X-Holi-User-ID: "{context.headers['x-holi-user-id']}"
    transforms:
      # Prefix for types
      - prefix:
          mode: wrap
          value: Rewards_
          includeRootOperations: false
          includeTypes: true
      # Prefix for operations
      - prefix:
          mode: wrap
          value: rewards_
          includeRootOperations: true
          includeTypes: false

logger: './logger'

cache:
  redis:
    host: '{env.REDIS_HOST}'
    port: '{env.REDIS_PORT}'
    password: '{env.REDIS_PASSWORD}'
    url: 'redis://:{env.REDIS_PASSWORD}@{env.REDIS_HOST}:{env.REDIS_PORT}/{env.REDIS_DB}'

plugins:
  - responseCache:
      cacheKey: '{operationName}-{documentString|hash}-{variableValues.offset}-{variableValues.limit}-{variableValues.geolocation.properties.place_id}-{variableValues.topicIds|hash}-{variableValues.skillIds|hash}'
      ttl: 0
      ttlPerCoordinate:
        # cache operation containing Query.discoverSpaces selection for 10 minutes
        - coordinate: Query.discoverSpaces
          ttl: 600000
  - maxDepth:
      n: 15 # maximum nesting level an operation is allowed to have

serve:
  browser: false
