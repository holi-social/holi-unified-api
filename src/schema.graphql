schema {
  query: Query
  mutation: Mutation
}

type Query {
  user(id: ID!): User
  allUsers(offset: Int, limit: Int): [User]
}

type Mutation {
  createUser(user: UserInput): User
  updateUser(id: ID!, user: UserInput): User
}

input UserInput {
  name: String!
  aboutMe: String
  pronouns: String
  location: String
}

type User {
  id: ID!
  name: String!
  aboutMe: String
  pronouns: String
  location: String
}
